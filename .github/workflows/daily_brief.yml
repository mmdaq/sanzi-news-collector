name: 每日三资监管简报

on:
  schedule:
    # 每天上午8:30（北京时间 UTC+8）执行
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-and-send:
    runs-on: ubuntu-latest
    # 【核心修复 1】：添加邮件发送容错，如果邮件发不出，整个 Action 也算成功（避免清空数据导致流程失败）
    continue-on-error: true
    
    # 【核心修复 2】：将环境变量提升到 Step 级别，确保 Python 能正确通过 os.getenv() 读取
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
      RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: 安装依赖
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 创建数据目录
      run: mkdir -p data
    
    # 【核心修复 3】：删除了原来这里的 env 块，因为已经在上面定义了
    - name: 运行采集程序
      run: python main.py
    
    - name: 上传日志和简报
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: collector-output
        path: data/
        retention-days: 7
